# Safe CI: install, lint, typecheck, test and build only.
#
# Deliberately absent — and it must stay that way:
#   * no deployment, no AWS credentials, no production database
#   * no exchange, webhook or TradingView network calls
#   * no optimizer or backtest runs (they read multi-GB result files)
# Every job runs offline apart from the npm registry, with one exception: the
# backend job starts a THROWAWAY PostgreSQL service container (image pulled
# from Docker Hub) for the SH-2 test. It holds only synthetic fixtures, is
# destroyed with the runner, and is never a production database.
name: CI

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No secret has a real value here. The suites run against fixtures only.
  CI: "true"

jobs:
  backend:
    name: platform backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    # shariahUniverseDb.test.ts (SH-2) proves database properties — append-only
    # history, snapshot immutability, CHECK constraints — that no fake can, and
    # it FAILS rather than skips when no server answers, so a green run is never
    # a silent skip. It recreates the database named in tests/test.env; the
    # credentials and port below must match that URL. 16 matches production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: platform frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no credential-shaped literals in tracked source
        run: bash scripts/ci/scan-secrets.sh
      - name: documented paths and cost-model figures match the source
        run: bash scripts/ci/check-docs.sh
      - name: no hardcoded home paths, TradingView automation or archive dependencies
        run: bash scripts/ci/check-repo-hygiene.sh
      - name: remediation ledger is in sync with its source of truth
        run: python3 scripts/ledger/render.py --check
